[package]
name = "agents-config"
version = "0.1.0"
edition = "2024"
description = "Shared, validated OpenAI-compatible agent configuration"
readme = "README.md"
documentation = "https://docs.rs/agents-config"
repository = "https://github.com/totto2727-org/agents-config"
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "AGENTS.md", "docs/**", "LICENSE"]
license = "MIT"
keywords = ["agents", "configuration", "openai-compatible"]
categories = ["config"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
rig = ["dep:rig"]

[dependencies]
http = "1"
rig = { version = "0.41", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
