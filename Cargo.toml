[package]
name = "project"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A simple Rust command-line application"
repository = "https://github.com/username/project"
readme = "README.md"
license = "MIT"
keywords = ["rust", "cli"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
