name: Publish crate

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-agents-config
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - uses: ./.github/actions/publish-crate
        with:
          working-directory: .
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
