name: Publish crate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<version> tag on main to publish to crates.io
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-agents-config
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'totto2727-org/agents-config' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate the release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(python3 .github/scripts/validate-release.py -- "$RELEASE_TAG")"
          git checkout --detach "$commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: DeterminateSystems/determinate-nix-action@2a0be2498974c2b6327e19780488744384637d88 # v3.21.7
      - name: Validate and package the exact release commit
        run: |
          nix develop --command just ci
          nix develop --command just package
          nix develop --command just publish-dry-run

  publish:
    needs: verify
    if: github.repository == 'totto2727-org/agents-config' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@2a0be2498974c2b6327e19780488744384637d88 # v3.21.7
      - name: Publish the verified crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo 'Configure CARGO_REGISTRY_TOKEN in the protected crates-io environment.' >&2
            exit 1
          fi
          nix develop --command cargo publish --locked --registry crates-io
