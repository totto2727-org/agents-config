name: Publish to crates.io
description: Publish the crate in working-directory, skipping versions already on crates.io.

inputs:
  working-directory:
    description: Directory containing the Cargo.toml to publish.
    required: true

runs:
  using: composite
  steps:
    - name: Check published version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
        metadata="$(cargo metadata --locked --no-deps --format-version 1)"
        package="$(jq -er --arg manifest "$PWD/Cargo.toml" '.packages[] | select(.manifest_path == $manifest) | [.name, .version] | @tsv' <<< "$metadata")"
        read -r name version <<< "$package"
        status="$(curl --user-agent "publish-crate (https://github.com/$GITHUB_REPOSITORY)" --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/$name/$version")"
        case "$status" in
          200) echo "$name $version is already published; skipping."; echo 'publish=false' >> "$GITHUB_OUTPUT" ;;
          404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
          *) echo "crates.io version lookup failed: HTTP $status" >&2; exit 1 ;;
        esac
    - name: Publish crate
      if: steps.version.outputs.publish == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
        cargo publish --locked --registry crates-io
